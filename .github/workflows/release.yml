name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Executables & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone executables for all platforms
        run: |
          mkdir -p release-binaries
          # Windows x64
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile release-binaries/privacy-mcp-windows-x64.exe
          cp release-binaries/privacy-mcp-windows-x64.exe release-binaries/privacy-mcp.exe
          
          # Linux x64
          bun build --compile --target=bun-linux-x64 src/index.ts --outfile release-binaries/privacy-mcp-linux-x64
          
          # macOS x64 (Intel) & arm64 (Apple Silicon)
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile release-binaries/privacy-mcp-macos-x64
          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile release-binaries/privacy-mcp-macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/privacy-mcp.exe
            release-binaries/privacy-mcp-windows-x64.exe
            release-binaries/privacy-mcp-linux-x64
            release-binaries/privacy-mcp-macos-x64
            release-binaries/privacy-mcp-macos-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
